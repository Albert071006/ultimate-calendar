name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify offline WeChat reader and media handling
        run: |
          python -m pip install -r scripts/wechat/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/wechat-worker.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/wechat-worker-media.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify optional WeChat setup in an isolated profile
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'wechat-setup-data'
          ./scripts/wechat/setup.ps1 -Edition Local -PythonPath (Get-Command python).Source -RuntimeDirectory (Join-Path $env:RUNNER_TEMP 'wechat-setup-runtime') -DataDirectory $data
          $config = Get-Content -LiteralPath (Join-Path $data 'wechat-runtime.json') -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $config.python -PathType Leaf)) { throw 'WeChat setup did not create the expected runtime.' }
      # Hosted Windows disk flushes can exceed Vitest's 5 s default in SQLite integration tests.
      - run: npm test -- --testTimeout=15000
      - run: npm run build
