name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Albert071006/ultimate-calendar'
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check tag and release notes
        run: npm run release:check-tag
      - run: npm ci
      - run: npm run typecheck
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify offline WeChat reader and media handling
        run: |
          python -m pip install -r scripts/wechat/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/wechat-worker.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/wechat-worker-media.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify optional WeChat setup in an isolated profile
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'wechat-setup-data'
          ./scripts/wechat/setup.ps1 -Edition Local -PythonPath (Get-Command python).Source -RuntimeDirectory (Join-Path $env:RUNNER_TEMP 'wechat-setup-runtime') -DataDirectory $data
          $config = Get-Content -LiteralPath (Join-Path $data 'wechat-runtime.json') -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $config.python -PathType Leaf)) { throw 'WeChat setup did not create the expected runtime.' }
      # Hosted Windows disk flushes can exceed Vitest's 5 s default in SQLite integration tests.
      - run: npm test -- --testTimeout=15000
      # package builds the renderer and Electron entry points before NSIS.
      - name: Build installer without publishing
        run: npm run package
      - name: Smoke test packaged app with isolated synthetic data
        shell: pwsh
        run: |
          $env:PLANNER_SMOKE_EXE = (Resolve-Path 'release/win-unpacked/终极日历.exe').Path
          npm run smoke
      - name: Build standalone local installer without publishing
        run: npm run package:local
      - name: Smoke test local edition with isolated synthetic data
        shell: pwsh
        run: |
          $env:PLANNER_SMOKE_EXE = (Resolve-Path 'release-local/win-unpacked/终极日历本地版.exe').Path
          npm run smoke
      - name: Build server and mobile deployment archive
        run: npm run package:server
      - name: Smoke test archived server and mobile assets with synthetic data
        run: npm run smoke:server
      - name: Prepare legacy desktop update route to server release
        run: node scripts/release-artifacts.mjs --prepare
      - name: Verify update metadata and checksums
        run: npm run release:verify
      - name: Verify both drafts, publish server first, then local Latest
        run: npm run release:publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
