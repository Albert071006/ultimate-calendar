name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Albert071006/ultimate-calendar'
    runs-on: windows-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check tag and release notes
        run: npm run release:check-tag
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # package builds the renderer and Electron entry points before NSIS.
      - name: Build installer without publishing
        run: npm run package
      - name: Smoke test packaged app with isolated synthetic data
        shell: pwsh
        run: |
          $env:PLANNER_SMOKE_EXE = (Resolve-Path 'release/win-unpacked/终极日历.exe').Path
          npm run smoke
      - name: Build standalone local installer without publishing
        run: npm run package:local
      - name: Smoke test local edition with isolated synthetic data
        shell: pwsh
        run: |
          $env:PLANNER_SMOKE_EXE = (Resolve-Path 'release-local/win-unpacked/终极日历本地版.exe').Path
          npm run smoke
      - name: Verify update metadata and checksums
        run: npm run release:verify
      - name: Upload draft assets, verify, then publish
        run: npm run release:publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
