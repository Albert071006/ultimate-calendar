name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      archive_run_id:
        description: '选择原 vX.Y.Z 标签，填写首次归档该版本的 push 工作流 Run ID'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'Albert071006/ultimate-calendar'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    outputs:
      name: ${{ steps.select.outputs.name }}
      build_id: ${{ steps.select.outputs.build_id }}
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve the original release archive
        id: select
        run: node scripts/release.mjs select-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BUILD_ID: ${{ inputs.archive_run_id }}

  build:
    needs: source
    if: needs.source.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check tag and release notes
        run: npm run release:check-tag
      - run: npm ci
      - run: npm run typecheck
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify offline WeChat reader and media handling
        run: |
          python -m pip install -r scripts/wechat/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/wechat-worker.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/wechat-worker-media.test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify optional WeChat setup in an isolated profile
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'wechat-setup-data'
          ./scripts/wechat/setup.ps1 -Edition Local -PythonPath (Get-Command python).Source -RuntimeDirectory (Join-Path $env:RUNNER_TEMP 'wechat-setup-runtime') -DataDirectory $data
          $config = Get-Content -LiteralPath (Join-Path $data 'wechat-runtime.json') -Raw | ConvertFrom-Json
          if (-not (Test-Path -LiteralPath $config.python -PathType Leaf)) { throw 'WeChat setup did not create the expected runtime.' }
      # Hosted Windows SQLite FULL flushes can pause beyond 15 s under shared disk load.
      # Keep real durability and every assertion; only allow these integration tests more time.
      - run: npm test -- --testTimeout=45000
      # package builds the renderer and Electron entry points before NSIS.
      - name: Build installer without publishing
        run: npm run package
      - name: Smoke test packaged app with isolated synthetic data
        shell: pwsh
        run: |
          $env:PLANNER_SMOKE_EXE = (Resolve-Path 'release/win-unpacked/终极日历.exe').Path
          npm run smoke
      - name: Build standalone local installer without publishing
        run: npm run package:local
      - name: Smoke test local edition with isolated synthetic data
        shell: pwsh
        run: |
          $env:PLANNER_SMOKE_EXE = (Resolve-Path 'release-local/win-unpacked/终极日历本地版.exe').Path
          npm run smoke
      - name: Build server and mobile deployment archive
        run: npm run package:server
      - name: Smoke test archived server and mobile assets with synthetic data
        run: npm run smoke:server
      - name: Prepare legacy desktop update route to server release
        run: node scripts/release-artifacts.mjs --prepare
      - name: Verify and archive both editions and the legacy route
        run: node scripts/release.mjs archive
        env:
          RELEASE_ARCHIVE_DIR: ${{ runner.temp }}/release-archive
          RELEASE_BUILD_ID: ${{ needs.source.outputs.build_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.source.outputs.name }}
          path: ${{ runner.temp }}/release-archive/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [source, build]
    if: ${{ !cancelled() && needs.source.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.source.outputs.name }}
          run-id: ${{ needs.source.outputs.build_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-archive
      - name: Verify archived bytes and both releases, publish server first, then local Latest
        run: npm run release:publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE_DIR: ${{ runner.temp }}/release-archive
          RELEASE_BUILD_ID: ${{ needs.source.outputs.build_id }}
